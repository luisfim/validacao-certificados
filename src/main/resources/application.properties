spring.application.name=validacao-certificados
server.address=${APP_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./dados/certificados
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.python=${PYTHON_COMMAND:python3}
app.tesseract=${TESSERACT_COMMAND:tesseract}
app.ocr-language=${OCR_LANGUAGE:por}
app.ocr-script=${OCR_SCRIPT:scripts/preprocessar.py}
app.ai-key=${OPENAI_API_KEY:}
app.ai-model=${OPENAI_MODEL:gpt-4o-mini}
app.ai-url=https://api.openai.com/v1/chat/completions
